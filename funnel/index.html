<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JoomPulse · Quiz · Encontre produtos que vendem o ano inteiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   JoomPulse Quiz Funnel — duas versões (clara / escura)
   V1: fundo branco, moldura azul nos blocos de pergunta
   V2: fundo escuro, moldura branca (cartão branco) nos blocos
   ============================================================ */
:root{
  /* pulse brand colors (do logo joompulse) */
  --blue:#0a6cf1; --blue-600:#0858d0; --blue-300:#5ea2ff;
  --green:#2fb344; --orange:#ff9500; --red:#f5333f;
  --grad:linear-gradient(96deg,#0a6cf1 0%,#3b8bff 55%,#5ea2ff 100%);
  --grad-pulse:linear-gradient(90deg,#0a6cf1,#2fb344 38%,#ff9500 70%,#f5333f);
  /* card internals (shared) */
  --ink:#0d1726; --ink-soft:#3a4a63; --mut:#697a96; --mut2:#9aa7bc;
  --line:#e7edf6; --line2:#eef3fb;
  --field:#f4f7fc; --field-line:#e3eaf5;
  --accent-soft:#eaf2ff;
  --ok:#16a34a;
  --radius:26px;
}
/* ---------- THEME: LIGHT (V1) ---------- */
html[data-theme="light"]{
  --page:#e9eefb;
  --page-grad:
     radial-gradient(900px 540px at 82% -8%,rgba(10,108,241,.16),transparent 60%),
     radial-gradient(760px 460px at 6% 4%,rgba(94,162,255,.14),transparent 55%),
     radial-gradient(700px 520px at 50% 120%,rgba(47,179,68,.08),transparent 60%);
  --frame:linear-gradient(180deg,#1f78ff,#0a6cf1); /* azul */
  --frame-glow:0 30px 70px -28px rgba(10,108,241,.55), 0 4px 0 rgba(10,108,241,.0);
  --card-border:rgba(10,108,241,.20);
  --card-border-w:1.5px;
  --logo:url("assets/logo-joom-dark.png");
  --logo-puro:url("assets/logo-puro-dark.png");
  --head-ink:#0d1726; --head-mut:#5b6b86;
  --chrome-line:rgba(13,23,38,.10);
}
/* ---------- THEME: DARK (V2) ---------- */
html[data-theme="dark"]{
  --page:#0a0713;
  --page-grad:
     radial-gradient(1000px 600px at 82% -6%,rgba(10,108,241,.30),transparent 60%),
     radial-gradient(820px 520px at 4% 6%,rgba(94,162,255,.16),transparent 55%),
     radial-gradient(760px 560px at 50% 122%,rgba(47,179,68,.12),transparent 60%);
  --frame:#ffffff; /* moldura branca = cartão branco */
  --frame-glow:0 40px 90px -30px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.04);
  --card-border:rgba(255,255,255,.9);
  --card-border-w:0px;
  /* cartão é sempre branco → logo escuro nos dois temas */
  --logo:url("assets/logo-joom-dark.png");
  --logo-puro:url("assets/logo-puro-dark.png");
  --head-ink:#f3f6ff; --head-mut:#a7b3cc;
  --chrome-line:rgba(255,255,255,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Albert Sans',system-ui,sans-serif;
  background:var(--page);
  background-image:var(--page-grad);
  background-attachment:fixed;
  color:var(--head-ink);
  display:flex;align-items:center;justify-content:center;
  min-height:100dvh;padding:26px 14px;
  transition:background-color .4s ease;
}
.dim{font-family:'Sora',sans-serif}

/* faint pulse-wave texture on the page */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:repeating-linear-gradient(115deg,transparent 0 38px,rgba(127,127,160,.035) 38px 39px);
  mask:radial-gradient(60% 60% at 50% 40%,#000,transparent 78%);
}

/* ============ VERSION SWITCHER ============ */
.switch{
  position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:40;
  display:flex;gap:4px;padding:5px;border-radius:999px;
  background:rgba(127,127,160,.16);backdrop-filter:blur(14px);
  border:1px solid var(--chrome-line);
}
.switch button{
  font-family:'Sora';font-weight:600;font-size:12.5px;letter-spacing:.2px;
  border:0;cursor:pointer;padding:8px 16px;border-radius:999px;color:var(--head-mut);
  background:transparent;transition:.2s;white-space:nowrap;
}
.switch button.on{background:var(--blue);color:#fff;box-shadow:0 6px 18px -6px rgba(10,108,241,.7)}

/* ============ PHONE STAGE ============ */
.stage{position:relative;z-index:1;width:100%;max-width:430px}
.card{
  position:relative;border-radius:var(--radius);overflow:hidden;
  background:#fff;color:var(--ink);
  border:var(--card-border-w) solid var(--card-border);
  box-shadow:var(--frame-glow);
  min-height:760px;display:flex;flex-direction:column;
  transition:box-shadow .4s ease;
}
/* azul "frame" bar on top (mostly visible in light) */
.card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:6px;z-index:6;
  background:var(--frame);
}

/* ----- chrome: back + logo + progress ----- */
.chrome{padding:22px 22px 8px;position:relative;z-index:5;background:#fff}
.chrome-top{display:flex;align-items:center;gap:10px;height:30px}
.back{
  width:34px;height:34px;border-radius:11px;border:1px solid var(--line);
  background:#fff;display:grid;place-items:center;cursor:pointer;flex:0 0 auto;
  transition:.15s;opacity:1;
}
.back:hover{background:var(--field)}
.back.hide{opacity:0;pointer-events:none}
.back svg{width:16px;height:16px;stroke:#5b6b86}
.logo{flex:1;height:26px;background:var(--logo) center/contain no-repeat}
.logo-spacer{width:34px;flex:0 0 auto}
.progress{height:7px;border-radius:99px;background:#eef2f8;margin-top:16px;overflow:hidden}
.progress.hide{visibility:hidden}
.progress span{display:block;height:100%;width:0;border-radius:99px;background:var(--grad);transition:width .5s cubic-bezier(.4,0,.2,1)}
.step-count{font-family:'Sora';font-size:11px;font-weight:600;letter-spacing:.6px;color:var(--mut2);margin-top:9px;text-transform:uppercase}
.step-count.hide{display:none}

/* ----- body / screens ----- */
.screens{position:relative;flex:1;display:flex;background:#fff}
.screen{
  position:absolute;inset:0;padding:8px 22px 112px;overflow-y:auto;
  display:flex;flex-direction:column;
  opacity:0;transform:translateY(14px);pointer-events:none;
  transition:opacity .38s ease,transform .38s ease;
}
.screen.active{opacity:1;transform:none;pointer-events:auto;position:relative;flex:1}
.screen::-webkit-scrollbar{width:0}

.eyebrow{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;
  font-family:'Sora';font-weight:700;font-size:11px;letter-spacing:1.3px;text-transform:uppercase;
  color:var(--blue);background:var(--accent-soft);padding:6px 12px;border-radius:999px;margin:6px 0 16px}
.eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 0 rgba(10,108,241,.6);animation:pulse 1.9s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(10,108,241,.5)}70%{box-shadow:0 0 0 8px rgba(10,108,241,0)}100%{box-shadow:0 0 0 0 rgba(10,108,241,0)}}

h2.q{font-family:'Sora';font-weight:800;font-size:25px;line-height:1.16;letter-spacing:-.5px;color:var(--ink)}
.q-sub{color:var(--mut);font-size:14.5px;margin-top:9px;line-height:1.45}

/* ----- option list ----- */
.opts{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.opt{
  display:flex;align-items:center;gap:13px;cursor:pointer;
  background:var(--field);border:1.5px solid var(--field-line);border-radius:16px;
  padding:14px 15px;transition:.16s;position:relative;
}
.opt:hover{border-color:var(--blue-300);background:#fff}
.opt .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:0 0 auto;
  background:#fff;border:1px solid var(--line);box-shadow:0 2px 8px -4px rgba(13,23,38,.18)}
.opt .lab{flex:1;text-align:left;font-weight:600;font-size:15.5px;color:var(--ink);line-height:1.25}
.opt .lab small{display:block;font-weight:500;font-size:12.5px;color:var(--mut);margin-top:2px}
.opt .tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--field-line);flex:0 0 auto;
  display:grid;place-items:center;transition:.16s}
.opt .tick svg{width:13px;height:13px;stroke:#fff;opacity:0;transform:scale(.5);transition:.16s}
.opt.sel{border-color:var(--blue);background:var(--accent-soft);box-shadow:0 10px 26px -14px rgba(10,108,241,.55)}
.opt.sel .ic{border-color:rgba(10,108,241,.35)}
.opt.sel .tick{background:var(--blue);border-color:var(--blue)}
.opt.sel .tick svg{opacity:1;transform:none}
.opt.multi .tick{border-radius:8px}

/* ----- search select ----- */
.search{display:flex;align-items:center;gap:10px;background:var(--field);border:1.5px solid var(--field-line);
  border-radius:14px;padding:12px 15px;margin-top:20px}
.search svg{width:18px;height:18px;stroke:var(--mut)}
.search input{border:0;background:transparent;outline:0;font-family:inherit;font-size:15px;color:var(--ink);width:100%}
.search input::placeholder{color:var(--mut2)}

/* ============ CONTINUE BUTTON ============ */
.foot{position:absolute;left:0;right:0;bottom:0;padding:16px 22px 20px;z-index:7;
  background:linear-gradient(180deg,rgba(255,255,255,0),#fff 28%)}
.cta{width:100%;border:0;cursor:pointer;font-family:'Sora';font-weight:700;font-size:16.5px;color:#fff;
  background:var(--grad);padding:17px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:9px;
  box-shadow:0 16px 34px -12px rgba(10,108,241,.7);transition:.18s}
.cta:hover{transform:translateY(-2px);box-shadow:0 22px 44px -12px rgba(10,108,241,.8)}
.cta:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.cta svg{width:18px;height:18px;stroke:#fff;transition:.18s}
.cta:hover:not(:disabled) svg{transform:translateX(4px)}
.skip{display:block;text-align:center;margin-top:12px;background:0;border:0;cursor:pointer;
  font-family:'Sora';font-weight:600;font-size:13px;color:var(--mut2)}
.skip:hover{color:var(--blue)}

/* ============ INTRO / LOADING SIM ============ */
.intro{align-items:center;text-align:center;justify-content:center}
.intro .ring{width:150px;height:150px;margin:6px auto 26px;position:relative}
.intro .ring svg{transform:rotate(-90deg)}
.intro .ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:'Sora';font-weight:800;font-size:34px;color:var(--ink)}
.intro h2{font-family:'Sora';font-weight:800;font-size:27px;line-height:1.14;letter-spacing:-.6px;color:var(--ink);max-width:15ch}
.intro p{color:var(--mut);font-size:15px;margin-top:12px;max-width:30ch;line-height:1.5}
.load-steps{margin:24px 0 4px;width:100%;display:flex;flex-direction:column;gap:11px}
.lstep{display:flex;align-items:center;gap:11px;font-size:14px;color:var(--mut2);font-weight:500;
  opacity:.45;transition:.4s;text-align:left}
.lstep.on{opacity:1;color:var(--ink)}
.lstep .lic{width:24px;height:24px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  border:2px solid var(--field-line);background:#fff;transition:.3s}
.lstep.on .lic{background:var(--green);border-color:var(--green)}
.lstep .lic svg{width:13px;height:13px;stroke:#fff;opacity:0;transition:.3s}
.lstep.on .lic svg{opacity:1}
.lstep .spin{width:15px;height:15px;border:2px solid var(--accent-soft);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ INTERSTITIALS ============ */
.inter{justify-content:flex-start}
.inter h2{font-family:'Sora';font-weight:800;font-size:24px;line-height:1.18;letter-spacing:-.5px;color:var(--ink);margin-top:6px}
.inter .lead{color:var(--mut);font-size:14.5px;margin-top:10px;line-height:1.5}
.badge-pill{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;font-family:'Sora';font-weight:700;
  font-size:12px;letter-spacing:.4px;padding:7px 13px;border-radius:999px;margin-bottom:4px;
  background:linear-gradient(96deg,rgba(47,179,68,.16),rgba(10,108,241,.14));color:var(--green);border:1px solid rgba(47,179,68,.3)}

/* social proof */
.avatars{display:flex;margin:18px 0 4px}
.avatars i{width:46px;height:46px;border-radius:50%;margin-left:-12px;border:3px solid #fff;background-size:cover;
  background-position:center;box-shadow:0 4px 12px -4px rgba(13,23,38,.3);font-style:normal;display:grid;place-items:center;
  font-weight:800;font-family:'Sora';color:#fff;font-size:16px}
.avatars i:first-child{margin-left:0}
.rate{display:flex;align-items:center;gap:8px;margin-top:14px;font-weight:700;color:var(--ink);font-size:14px}
.stars{color:var(--orange);letter-spacing:2px;font-size:15px}
.proof-logos{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.proof-logos span{font-family:'Sora';font-weight:700;font-size:13px;color:var(--ink-soft);background:var(--field);
  border:1px solid var(--field-line);padding:8px 13px;border-radius:11px}

/* stat cards */
.stat-row{display:flex;gap:11px;margin-top:20px}
.stat{flex:1;background:var(--field);border:1px solid var(--field-line);border-radius:16px;padding:15px 14px}
.stat b{font-family:'Sora';font-weight:800;font-size:23px;color:var(--blue);display:block;letter-spacing:-.5px}
.stat small{color:var(--mut);font-size:12px;font-weight:600;display:block;margin-top:3px}

/* before/after chart */
.chart{margin-top:22px;background:var(--field);border:1px solid var(--field-line);border-radius:18px;padding:20px 18px}
.chart .ch-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.chart .ch-head b{font-family:'Sora';font-weight:700;font-size:14px;color:var(--ink)}
.chart .ch-up{font-family:'Sora';font-weight:800;font-size:13px;color:var(--green);background:rgba(47,179,68,.12);padding:5px 10px;border-radius:8px}
.bars{display:flex;align-items:flex-end;gap:18px;height:150px;padding-top:6px}
.bargrp{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%}
.bargrp .bar{width:100%;max-width:74px;border-radius:12px 12px 6px 6px;align-self:center;height:0;transition:height 1s cubic-bezier(.3,1,.4,1);position:relative}
.bargrp .bar.a{background:linear-gradient(180deg,#c9d4e6,#aab8d0)}
.bargrp .bar.b{background:var(--grad)}
.bargrp .bv{position:absolute;top:-22px;left:0;right:0;text-align:center;font-family:'Sora';font-weight:800;font-size:13px;color:var(--ink)}
.bargrp .blab{font-size:12px;font-weight:600;color:var(--mut)}

/* agree / emoji scale */
.agree-card{margin-top:8px;background:var(--field);border:1px solid var(--field-line);border-radius:20px;padding:22px 18px;text-align:center}
.agree-card .qm{font-family:'Sora';font-weight:800;font-size:20px;line-height:1.25;color:var(--ink)}
.emoji-row{display:flex;justify-content:space-between;gap:6px;margin-top:24px}
.emo{flex:1;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;transition:.15s}
.emo .face{width:100%;aspect-ratio:1;max-width:54px;border-radius:50%;display:grid;place-items:center;font-size:26px;
  background:#fff;border:2px solid var(--field-line);transition:.18s;filter:grayscale(.4);opacity:.7}
.emo:hover .face{transform:translateY(-3px)}
.emo.sel .face{border-color:var(--blue);background:var(--accent-soft);filter:none;opacity:1;transform:scale(1.08);
  box-shadow:0 10px 22px -10px rgba(10,108,241,.6)}
.emo small{font-size:9.5px;font-weight:600;color:var(--mut2);line-height:1.1;height:22px}
.emo.sel small{color:var(--blue)}

/* testimonial */
.tcard{margin-top:8px;border-radius:20px;overflow:hidden;border:1px solid var(--field-line);background:#fff;
  box-shadow:0 16px 40px -22px rgba(13,23,38,.35)}
.tcard .ttop{background:var(--grad);padding:20px;color:#fff}
.tcard .ttop .ttitle{font-family:'Sora';font-weight:800;font-size:21px;letter-spacing:-.4px;line-height:1.15}
.tcard .tbody{padding:18px 18px 20px}
.tcard .who{display:flex;align-items:center;gap:11px}
.tcard .who i{width:42px;height:42px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;
  font-weight:800;font-family:'Sora';font-style:normal}
.tcard .who b{font-family:'Sora';font-size:14px;color:var(--ink);display:block}
.tcard .who small{font-size:12px;color:var(--mut)}
.tcard .quote{margin-top:13px;font-size:14.5px;color:var(--ink-soft);line-height:1.5}
.tcard .mini{display:flex;gap:10px;margin-top:15px;padding-top:15px;border-top:1px solid var(--line2)}
.tcard .mini div{flex:1}
.tcard .mini b{font-family:'Sora';font-weight:800;font-size:17px;color:var(--green)}
.tcard .mini small{display:block;font-size:11px;color:var(--mut);font-weight:600}

/* feature list */
.feat-il{margin:16px auto 6px;width:118px;height:118px;border-radius:30px;background:var(--grad);
  display:grid;place-items:center;box-shadow:0 22px 44px -16px rgba(10,108,241,.7);position:relative}
.feat-il::after{content:"";position:absolute;inset:-8px;border-radius:36px;border:2px solid rgba(10,108,241,.25);animation:halo 2.4s infinite}
@keyframes halo{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.18);opacity:0}}
.feat-il svg{width:58px;height:58px;stroke:#fff;fill:none}
.feats{display:flex;flex-direction:column;gap:11px;margin-top:20px}
.feat{display:flex;align-items:center;gap:12px;font-size:14.5px;font-weight:600;color:var(--ink)}
.feat .fk{width:28px;height:28px;border-radius:9px;background:rgba(47,179,68,.13);display:grid;place-items:center;flex:0 0 auto}
.feat .fk svg{width:15px;height:15px;stroke:var(--green)}

/* result */
.result{text-align:center;align-items:center}
.result .celebrate{font-size:46px;margin:8px 0 4px}
.result h2{font-family:'Sora';font-weight:800;font-size:25px;letter-spacing:-.5px;color:var(--ink);line-height:1.15}
.summary{width:100%;margin-top:20px;background:var(--field);border:1px solid var(--field-line);border-radius:18px;padding:18px;text-align:left}
.summary .srow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line)}
.summary .srow:last-child{border:0}
.summary .srow span{color:var(--mut);font-size:13.5px;font-weight:600}
.summary .srow b{font-family:'Sora';font-size:14px;color:var(--ink);text-align:right;max-width:60%}
.summary .srow b.hl{color:var(--blue)}
.vs{display:flex;gap:11px;margin-top:16px;width:100%}
.vs .col{flex:1;border-radius:16px;padding:15px 14px;text-align:left}
.vs .col.no{background:#fef2f3;border:1px solid #fbd5d8}
.vs .col.yes{background:rgba(47,179,68,.08);border:1.5px solid rgba(47,179,68,.4)}
.vs .col h4{font-family:'Sora';font-size:12.5px;font-weight:700;margin-bottom:10px;color:var(--ink)}
.vs .col li{list-style:none;font-size:12.5px;font-weight:500;color:var(--ink-soft);display:flex;gap:7px;align-items:flex-start;margin-bottom:8px;line-height:1.3}
.vs .col li svg{width:14px;height:14px;flex:0 0 auto;margin-top:1px}
.guarantee{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:14px;color:var(--mut);font-size:12px;font-weight:600}
.guarantee svg{width:15px;height:15px;stroke:var(--green)}

/* puro footer credit inside card */
.copartner{display:flex;align-items:center;justify-content:center;gap:9px;padding:13px;border-top:1px solid var(--line2);
  background:#fff;font-size:10.5px;color:var(--mut2);font-weight:600;font-family:'Sora';letter-spacing:.3px}
.copartner .pl{height:15px;width:78px;background:var(--logo-puro) center/contain no-repeat;opacity:.9}

@media(max-width:380px){
  .card{min-height:720px}
  h2.q{font-size:23px}
  .screen{padding-left:18px;padding-right:18px}
  .chrome{padding-left:18px;padding-right:18px}
  .foot{padding-left:18px;padding-right:18px}
}
</style>
</head>
<body>

<div class="switch dim">
  <button id="bLight" onclick="setTheme('light')">☀︎ V1 · Clara</button>
  <button id="bDark" class="on" onclick="setTheme('dark')">☾ V2 · Escura</button>
</div>

<main class="stage">
  <div class="card">
    <div class="chrome">
      <div class="chrome-top">
        <button class="back hide" id="back" onclick="goBack()" aria-label="Voltar">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="logo" role="img" aria-label="JoomPulse"></div>
        <div class="logo-spacer"></div>

function render(){

    progBar.style.width = (n/totalSteps*100)+'%';

}

/* ===================== INTERACTIONS ===================== */
function pick(i){
  const s = SCREENS[idx];
  document.querySelectorAll('#opts .opt').forEach(o=>o.classList.remove('sel'));
  const el = document.querySelector(`#opts .opt[data-i="${i}"]`);
  el.classList.add('sel');
  answers[idx] = { i, label: s.opts[i].lab || s.opts[i] };
  const cta = document.getElementById('cta'); cta.disabled=false;
  setTimeout(next, 260); // auto-advance like Zeely
}
function pickMulti(i){
  const el = document.querySelector(`#opts .opt[data-i="${i}"]`);
  el.classList.toggle('sel');
  const sel = [...document.querySelectorAll('#opts .opt.sel')].map(o=>+o.dataset.i);
  answers[idx] = { multi: sel };
  document.getElementById('cta').disabled = sel.length===0;
}
function pickEmo(i){
  document.querySelectorAll('#emos .emo').forEach(o=>o.classList.remove('sel'));
  document.querySelector(`#emos .emo[data-i="${i}"]`).classList.add('sel');
  answers[idx] = { emo:i };
  document.getElementById('cta').disabled=false;
  setTimeout(next, 320);
}
function filterCats(v){
  v = v.toLowerCase().trim();
  document.querySelectorAll('#opts .opt').forEach(o=>{
    o.style.display = o.dataset.name.includes(v) ? '' : 'none';
  });
}

/* ---- loading simulation (intro + analyzing) ---- */
const AFTER = {
  intro:(s,el)=>runLoader(el,()=>{ document.getElementById('cta').disabled=false; }),
  analyzing:(s,el)=>runLoader(el,()=>setTimeout(next,500), 1500),
  chart:(s,el)=>setTimeout(()=>el.querySelectorAll('.bar').forEach(b=>b.style.height=b.dataset.h+'%'),120),
};

function runLoader(el, done, total=2600){
  const fill = el.querySelector('#ringFill');
  const pct = el.querySelector('#pct');
  const steps = [...el.querySelectorAll('.lstep')];
  const C = 414.7;
  let p = 0;
  const per = total/steps.length;
  // activate first spinner
  function activateSpin(k){
    steps.forEach((st,j)=>{
      const sp = st.querySelector('.spin'), ck = st.querySelector('svg:not(.spin)');
      if(j<k){ st.classList.add('on'); sp.style.display='none'; }
      else if(j===k){ st.classList.remove('on'); sp.style.display='block'; }
      else { st.classList.remove('on'); sp.style.display='none'; }
    });
  }
  activateSpin(0);
  const t0 = performance.now();
  function tick(now){
    p = Math.min(1,(now-t0)/total);
    const eased = p<.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
    if(fill) fill.style.strokeDashoffset = C*(1-eased);
    if(pct) pct.textContent = Math.round(eased*100)+'%';
    const k = Math.min(steps.length-1, Math.floor(p*steps.length));
    activateSpin(k);
    if(p<1){ requestAnimationFrame(tick); }
    else { steps.forEach(st=>{st.classList.add('on'); st.querySelector('.spin').style.display='none';}); done&&done(); }
  }
  requestAnimationFrame(tick);
}

render();
</script>
</body>
</html>
